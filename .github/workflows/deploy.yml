name: Deploy

on:
  push:
    branches: [self-host]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # wrangler.toml stays out of the repo (gitignored upstream): the deploy
      # config is generated here from repo secrets so IDs are not published.
      # Vars and secrets are managed in the Cloudflare dashboard (Workers >
      # Settings > Variables and Secrets); keep_vars preserves them on deploy.
      - name: Generate wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cat > wrangler.toml <<'EOF'
          name = "cloudflare-cost-hub"
          main = "dist/server/index.js"
          compatibility_date = "2024-06-20"
          compatibility_flags = ["nodejs_compat"]

          keep_vars = true

          [site]
          bucket = "./dist/client"

          [[d1_databases]]
          binding = "DB"
          database_name = "cloudflare-cost-hub-db"
          database_id = "PLACEHOLDER_D1_ID"

          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "cloudflare-cost-hub-data"

          [triggers]
          crons = ["0 1 * * *"]
          EOF
          sed -i "s/PLACEHOLDER_D1_ID/$D1_DATABASE_ID/" wrangler.toml

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cloudflare-cost-hub-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
