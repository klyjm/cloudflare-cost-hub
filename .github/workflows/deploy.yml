name: Deploy

on:
  push:
    branches: [self-host]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: cloudflare-cost-hub-db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # Provision on first run, reuse afterwards (idempotent). Existence checks
      # go through the REST API with jq; creation goes through wrangler (same
      # pinned version as the deploy step). Only the token + account id come
      # from repo secrets; the resource name is a constant below.
      # (No R2: the snapshot archive to R2 is optional in the app; D1 rows are
      # the source of truth for cost trends.)
      - name: Ensure D1 database exists
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")
          DB_ID=$(printf '%s' "$LIST" | jq -r --arg n "$D1_NAME" '.result[] | select(.name == $n) | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$D1_NAME" > /dev/null
            LIST=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")
            DB_ID=$(printf '%s' "$LIST" | jq -r --arg n "$D1_NAME" '.result[] | select(.name == $n) | .uuid' | head -n1)
            echo "Created D1 database $D1_NAME ($DB_ID)"
          else
            echo "Reusing existing D1 database $D1_NAME ($DB_ID)"
          fi
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      # wrangler.toml stays out of the repo (gitignored upstream): generated in
      # CI from the ensured resource IDs. keep_vars preserves vars/secrets that
      # are managed in the Cloudflare dashboard across deploys.
      - name: Generate wrangler.toml
        run: |
          cat > wrangler.toml <<'EOF'
          name = "cloudflare-cost-hub"
          main = "dist/server/index.js"
          compatibility_date = "2024-06-20"
          compatibility_flags = ["nodejs_compat"]

          keep_vars = true

          [site]
          bucket = "./dist/client"

          [[d1_databases]]
          binding = "DB"
          database_name = "DATABASE_NAME_PLACEHOLDER"
          database_id = "DATABASE_ID_PLACEHOLDER"

          # Workers Logs: makes console output from the daily cron (snapshot /
          # alert failures) visible in the Cloudflare dashboard.
          [observability]
          enabled = true

          [triggers]
          crons = ["0 1 * * *"]
          EOF
          sed -i "s/DATABASE_NAME_PLACEHOLDER/$D1_NAME/; s/DATABASE_ID_PLACEHOLDER/$D1_DATABASE_ID/" wrangler.toml

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Deploy Worker
        run: npx wrangler deploy
